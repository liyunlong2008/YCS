[project]
name = "yunlong"
version = "0.1.0"
description = "云龙挑战赛（YCS）- ETH 永续合约自动交易系统（AI 分析 + Maker 优先 + 严格风控 + 自动恢复 + 利润保护）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.76",
    "fastapi>=0.141.1",
    "litellm>=1.98.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
